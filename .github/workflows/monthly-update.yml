name: Monthly auto-update — pages publiques

on:
  schedule:
    # GitHub Actions DROP (pas seulement retarde) les crons schedule pendant
    # les pics de charge. Le 1er du mois entre 06:00 et 07:00 UTC est le créneau
    # le plus saturé : le cron '0 6 1 * *' a été skipé en mai 2026, et le
    # palliatif '17 6 1 * *' (minute non-ronde mais toujours dans la fenêtre
    # chargée) a de nouveau été skipé en juin 2026. Cf. doc GitHub Actions :
    # "The schedule event can be delayed during periods of high loads ... High
    # load times include the start of every hour."
    #
    # Mitigation robuste : plusieurs tentatives réparties sur des minutes
    # non-rondes ET des heures hors-pointe, plus un filet de sécurité les jours
    # 2 et 3 du mois. Le job est idempotent (commit/push UNIQUEMENT si les pages
    # ont changé, cf. `git diff --cached --quiet`), donc les exécutions
    # surnuméraires sont inoffensives : la première qui passe publie, les
    # suivantes ne trouvent aucun diff et ne committent rien.
    - cron: '23 9 1 * *'    # 1er du mois, 09:23 UTC — créneau principal hors-pointe
    - cron: '37 13 1 * *'   # 1er du mois, 13:37 UTC — 2e tentative même jour
    - cron: '23 9 2 * *'    # 2 du mois, 09:23 UTC — filet de sécurité J+1
    - cron: '23 9 3 * *'    # 3 du mois, 09:23 UTC — filet de sécurité J+2
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup uv (Python 3.13)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sync dependencies (engine)
        working-directory: engine
        run: uv sync

      - name: Refresh data + append journal
        working-directory: engine
        run: uv run chillbtc-monthly

      - name: Génération des 3 pages publiques
        working-directory: engine
        run: uv run chillbtc-pages

      - name: Commit & push (si changements)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/signaux.md docs/historique-annuel.md docs/historique-mensuel.md \
                  engine/output/live_journal.csv \
                  engine/data/btc_daily.csv engine/data/btc_monthly.csv
          # Idempotence : si aucune des tentatives cron précédentes n'a déjà
          # publié le signal du mois, il y a un diff → on commit. Sinon, no-op.
          if git diff --cached --quiet; then
            echo "Aucun changement, rien à commit (mois déjà publié ou données inchangées)."
          else
            git commit -m "chore(auto): pages mensuelles — $(date -u +%Y-%m-%d)"
            git push
          fi
